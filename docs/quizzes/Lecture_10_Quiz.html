<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINC409/609 - Fixed Income Securities</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#d7dee8;
      --accent:#1d4ed8;
      --accent-soft:#e8f0ff;
      --correct:#166534;
      --correct-bg:#ecfdf3;
      --correct-border:#bbf7d0;
      --incorrect:#991b1b;
      --incorrect-bg:#fef2f2;
      --incorrect-border:#fecaca;
      --warning:#92400e;
      --warning-bg:#fff7ed;
      --warning-border:#fed7aa;
      --shadow:0 10px 30px rgba(17, 24, 39, 0.08);
      --radius:18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(29,78,216,0.08), transparent 24%),
        radial-gradient(circle at top left, rgba(37,99,235,0.06), transparent 18%),
        var(--bg);
      line-height: 1.5;
    }

    .container {
      width: min(1080px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    .hero {
      background: linear-gradient(135deg, #123a9b, #1d4ed8 55%, #3b82f6);
      color: white;
      border-radius: 24px;
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 3.5vw, 2.7rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 1rem;
      max-width: 820px;
      color: rgba(255,255,255,0.92);
    }

    .hero .meta {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.92rem;
      backdrop-filter: blur(8px);
    }

    .toolbar,
    .score-panel {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar .left,
    .toolbar .right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(29, 78, 216, 0.18);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 0.92rem;
    }

    .quiz-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .question-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px 10px;
      border-bottom: 1px solid rgba(215, 222, 232, 0.7);
      background: linear-gradient(180deg, rgba(29,78,216,0.035), transparent);
    }

    .question-number {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      border: 1px solid rgba(29,78,216,0.12);
    }

    .question-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .question-body {
      padding: 16px 20px 20px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    label.option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    }

    label.option:hover {
      border-color: rgba(29,78,216,0.4);
      background: rgba(29,78,216,0.03);
      transform: translateY(-1px);
    }

    label.option input {
      margin-top: 2px;
      transform: scale(1.1);
      accent-color: var(--accent);
    }

    .option-text {
      font-size: 0.98rem;
    }

    .question-actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .feedback {
      margin-top: 14px;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid transparent;
      display: none;
    }

    .feedback.show { display: block; }

    .feedback.correct {
      background: var(--correct-bg);
      color: var(--correct);
      border-color: var(--correct-border);
    }

    .feedback.incorrect {
      background: var(--incorrect-bg);
      color: var(--incorrect);
      border-color: var(--incorrect-border);
    }

    .feedback.warning {
      background: var(--warning-bg);
      color: var(--warning);
      border-color: var(--warning-border);
    }

    .feedback strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.98rem;
    }

    .score-panel {
      display: none;
    }

    .score-panel.show {
      display: block;
    }

    .score-title {
      margin: 0 0 8px;
      font-size: 1.18rem;
    }

    .score-big {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .score-subtext {
      margin-top: 8px;
      color: var(--muted);
    }

    .legend {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .footer-note {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.94rem;
      padding: 0 4px;
    }

    .status-badge {
      font-size: 0.9rem;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: #fff;
    }

    @media (max-width: 720px) {
      .hero, .toolbar, .question-body, .question-head, .score-panel {
        padding-left: 16px;
        padding-right: 16px;
      }

      .question-head {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <h1>Quiz Lecture 10: Hedging Interest Rate Risk</h1>
    </section>

    <section class="toolbar" aria-label="Quiz controls">
      <div class="left">
        <button class="btn-primary" id="checkAllBtn" type="button">Check All &amp; Show Score</button>
        <button class="btn-secondary" id="resetBtn" type="button">Reset Quiz</button>
      </div>
      <div class="right">
        <span class="status-badge" id="progressBadge">0 of 10 answered</span>
      </div>
    </section>

    <section class="score-panel" id="scorePanel" aria-live="polite">
      <h2 class="score-title">Quiz Score</h2>
      <div class="score-big" id="scoreText">0 / 10</div>
      <div class="score-subtext" id="scoreSubtext">Select answers and check the quiz to see your score.</div>
      <div class="legend">Per-question feedback appears under each item after you check it.</div>
    </section>

    <main id="quiz" class="quiz-grid" aria-label="Quiz questions"></main>


  </div>

  <script>
    const questions = [
      {
        question: "A long fixed-rate bond portfolio is most likely to lose value when interest rates:",
        options: [
          "rise, because higher discount rates reduce the present value of fixed cash flows.",
          "rise, because the coupon rate on existing bonds is automatically reduced.",
          "fall, because the face value of the bond declines when rates fall.",
          "fall, because duration becomes negative when yields decrease."
        ],
        correctIndex: 0,
        explanation: "For a long bond position, higher yields mean future cash flows are discounted more heavily, so price falls."
      },
      {
        question: "Which expression matches the approximation for the percentage price change of a bond portfolio when yields change by Δy?",
        options: [
          "ΔP/P ≈ +MD × Δy + (1/2) × CX × (Δy)^2",
          "ΔP/P ≈ -MD × Δy + (1/2) × CX × (Δy)^2",
          "ΔP/P ≈ -MD × Δy - (1/2) × CX × (Δy)^2",
          "ΔP/P ≈ CX × Δy - (1/2) × MD × (Δy)^2"
        ],
        correctIndex: 1,
        explanation: "The duration term enters with a negative sign, while the convexity term enters positively in the approximation."
      },
      {
        question: "If the hedge condition must hold for all yield changes in the duration-convexity approximation, which portfolio conditions are sufficient?",
        options: [
          "The portfolio must trade at par and have no coupons.",
          "Only modified duration must equal zero.",
          "Only convexity must equal zero.",
          "Modified duration and convexity must both equal zero."
        ],
        correctIndex: 3,
        explanation: "To eliminate both the linear and quadratic yield effects in the approximation, the portfolio must have MD = 0 and CX = 0."
      },
      {
        question: "A duration-only hedge is primarily trying to eliminate:",
        options: [
          "default risk.",
          "the first-order, linear sensitivity to small yield changes.",
          "reinvestment risk from future coupons.",
          "foreign-exchange risk."
        ],
        correctIndex: 1,
        explanation: "A duration-only hedge neutralizes the first-order yield effect. That is why it works best for small rate changes."
      },
      {
        question: "Issuing a bond is economically similar to:",
        options: [
          "taking a long position in the bond.",
          "taking a short position in the bond.",
          "holding a risk-free cash position.",
          "owning a call option on the bond."
        ],
        correctIndex: 1,
        explanation: "Once a firm issues a bond, it owes the bond’s cash flows. Economically, that exposure behaves like a short position in the bond."
      },
      {
        question: "Why can a long position in a shorter-term zero-coupon bond help hedge a short position in a longer-term zero-coupon liability?",
        options: [
          "Because the shorter bond’s coupon adjusts immediately when rates change.",
          "Because both positions lose value when yields fall.",
          "Because the hedge bond gains value when yields fall, helping offset the increase in the liability’s value.",
          "Because shorter-term zero-coupon bonds always have more convexity than longer-term bonds."
        ],
        correctIndex: 2,
        explanation: "If yields fall, the liability becomes more expensive, but the long hedge bond also rises in value. That offset is the core hedging idea."
      },
      {
        question: "In the pension-fund example, what pair of conditions determines the hedge weights in the 1-year and 30-year zero-coupon bonds?",
        options: [
          "The coupon rates must match, and the liabilities must trade at par.",
          "Asset modified duration must equal liability modified duration, and the fund must be fully funded (assets = liabilities).",
          "Convexity must be zero, and the initial cash outlay must be zero.",
          "Face values of the hedge bonds must sum to the face value of the liability."
        ],
        correctIndex: 1,
        explanation: "Two constraints: match interest-rate sensitivity through modified duration and make the fund fully funded by matching asset value to liability value."
      },
      {
        question: "Why does the duration-only hedge become imperfect when interest-rate changes are large?",
        options: [
          "Because large yield changes cause bond cash flows to disappear.",
          "Because modified duration stops existing when rates move by more than 100 basis points.",
          "Because the hedge ignores convexity, so the second-order price effect is not matched.",
          "Because large rate changes always create credit losses."
        ],
        correctIndex: 2,
        explanation: "Duration is a first-order approximation. For larger yield moves, convexity matters more, and an unmatched convexity exposure creates hedge error."
      },
      {
        question: "In a zero-initial-cash-outlay hedge, the additional constraint means:",
        options: [
          "the hedge portfolio must have zero modified duration.",
          "the total face value of the long positions must equal zero.",
          "the initial market value of the long positions must equal the initial market value of the short position.",
          "the hedge can only be built with zero-coupon bonds."
        ],
        correctIndex: 2,
        explanation: "Zero initial cash outlay means the hedge is financed at inception: the value of the long positions equals the value of the short position initially."
      },
      {
        question: "When a duration-only hedge is extendend to include convexity using two hedge bonds, why are two equations needed?",
        options: [
          "One equation is for coupon income and one is for principal repayment.",
          "One equation matches the Δy term (duration) and one matches the (Δy)^2 term (convexity).",
          "One equation is for assets and one is for liabilities, regardless of risk.",
          "One equation matches the yield level and one matches the yield-curve slope."
        ],
        correctIndex: 1,
        explanation: "There are the terms in Δy and (Δy)^2. The first equation matches duration exposure; the second matches convexity exposure."
      }
    ];

    const quizEl = document.getElementById("quiz");
    const progressBadge = document.getElementById("progressBadge");
    const scorePanel = document.getElementById("scorePanel");
    const scoreText = document.getElementById("scoreText");
    const scoreSubtext = document.getElementById("scoreSubtext");
    const checkAllBtn = document.getElementById("checkAllBtn");
    const resetBtn = document.getElementById("resetBtn");

    function renderQuiz() {
      quizEl.innerHTML = "";
      questions.forEach((q, index) => {
        const card = document.createElement("section");
        card.className = "question-card";
        card.dataset.index = index;

        const optionsHTML = q.options.map((option, optionIndex) => `
          <label class="option">
            <input type="radio" name="q${index}" value="${optionIndex}" />
            <span class="option-text"><strong>${String.fromCharCode(65 + optionIndex)}.</strong> ${option}</span>
          </label>
        `).join("");

        card.innerHTML = `
          <div class="question-head">
            <div class="question-number">${index + 1}</div>
            <h2 class="question-title">${q.question}</h2>
          </div>
          <div class="question-body">
            <div class="options" role="radiogroup" aria-label="Question ${index + 1}">
              ${optionsHTML}
            </div>
            <div class="question-actions">
              <button class="btn-small btn-primary" type="button" data-action="check" data-index="${index}">
                Check Answer
              </button>
            </div>
            <div class="feedback" id="feedback-${index}" aria-live="polite"></div>
          </div>
        `;
        quizEl.appendChild(card);
      });
      updateProgress();
    }

    function getSelectedIndex(questionIndex) {
      const selected = document.querySelector(`input[name="q${questionIndex}"]:checked`);
      return selected ? Number(selected.value) : null;
    }

    function showFeedback(questionIndex, mode = "single") {
      const q = questions[questionIndex];
      const selectedIndex = getSelectedIndex(questionIndex);
      const feedbackEl = document.getElementById(`feedback-${questionIndex}`);
      feedbackEl.className = "feedback show";

      if (selectedIndex === null) {
        feedbackEl.classList.add("warning");
        feedbackEl.innerHTML = `
          <strong>No answer selected yet.</strong>
          Choose one option, then check your answer.
        `;
        return { answered: false, correct: false };
      }

      if (selectedIndex === q.correctIndex) {
        feedbackEl.classList.add("correct");
        feedbackEl.innerHTML = `
          <strong>Correct.</strong>
          ${q.explanation}
        `;
        return { answered: true, correct: true };
      } else {
        feedbackEl.classList.add("incorrect");
        const correctLetter = String.fromCharCode(65 + q.correctIndex);
        feedbackEl.innerHTML = `
          <strong>Incorrect.</strong>
          Correct answer: <strong>${correctLetter}</strong>. ${q.explanation}
        `;
        return { answered: true, correct: false };
      }
    }

    function updateProgress() {
      let answered = 0;
      questions.forEach((_, index) => {
        if (getSelectedIndex(index) !== null) answered += 1;
      });
      progressBadge.textContent = `${answered} of ${questions.length} answered`;
    }

    function scoreQuiz() {
      let answered = 0;
      let correct = 0;

      questions.forEach((_, index) => {
        const result = showFeedback(index, "all");
        if (result.answered) answered += 1;
        if (result.correct) correct += 1;
      });

      const percent = Math.round((correct / questions.length) * 100);
      scorePanel.classList.add("show");
      scoreText.textContent = `${correct} / ${questions.length}`;

      if (answered < questions.length) {
        scoreSubtext.textContent = `You have ${correct} correct so far (${percent}%). ${questions.length - answered} question(s) are still unanswered.`;
      } else {
        scoreSubtext.textContent = `You answered all questions. Score: ${percent}%.`;
      }
    }

    function resetQuiz() {
      document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.checked = false;
      });
      document.querySelectorAll('.feedback').forEach(el => {
        el.className = 'feedback';
        el.innerHTML = '';
      });
      scorePanel.classList.remove("show");
      scoreText.textContent = "0 / 10";
      scoreSubtext.textContent = "Select answers and check the quiz to see your score.";
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("change", (event) => {
      if (event.target.matches('input[type="radio"]')) {
        updateProgress();
      }
    });

    document.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action='check']");
      if (!btn) return;
      const index = Number(btn.dataset.index);
      showFeedback(index, "single");
      updateProgress();
    });

    checkAllBtn.addEventListener("click", scoreQuiz);
    resetBtn.addEventListener("click", resetQuiz);

    renderQuiz();
  </script>
</body>
</html>
