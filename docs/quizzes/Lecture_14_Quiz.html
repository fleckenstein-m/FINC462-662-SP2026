<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINC409/609 - Fixed Income Securities</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#d7dee8;
      --accent:#1d4ed8;
      --accent-soft:#e8f0ff;
      --correct:#166534;
      --correct-bg:#ecfdf3;
      --correct-border:#bbf7d0;
      --incorrect:#991b1b;
      --incorrect-bg:#fef2f2;
      --incorrect-border:#fecaca;
      --warning:#92400e;
      --warning-bg:#fff7ed;
      --warning-border:#fed7aa;
      --shadow:0 10px 30px rgba(17, 24, 39, 0.08);
      --radius:18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(29,78,216,0.08), transparent 24%),
        radial-gradient(circle at top left, rgba(37,99,235,0.06), transparent 18%),
        var(--bg);
      line-height: 1.5;
    }

    .container {
      width: min(1080px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    .hero {
      background: linear-gradient(135deg, #123a9b, #1d4ed8 55%, #3b82f6);
      color: white;
      border-radius: 24px;
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
    }

    .hero .course-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: 10px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 3.5vw, 2.7rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 1rem;
      max-width: 820px;
      color: rgba(255,255,255,0.92);
    }

    .hero .meta {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.92rem;
      backdrop-filter: blur(8px);
    }

    .toolbar,
    .score-panel {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar .left,
    .toolbar .right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(29, 78, 216, 0.18);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 0.92rem;
    }

    .quiz-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .question-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px 10px;
      border-bottom: 1px solid rgba(215, 222, 232, 0.7);
      background: linear-gradient(180deg, rgba(29,78,216,0.035), transparent);
    }

    .question-number {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      border: 1px solid rgba(29,78,216,0.12);
    }

    .question-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .question-body {
      padding: 16px 20px 20px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    label.option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    }

    label.option:hover {
      border-color: rgba(29,78,216,0.4);
      background: rgba(29,78,216,0.03);
      transform: translateY(-1px);
    }

    label.option input {
      margin-top: 2px;
      transform: scale(1.1);
      accent-color: var(--accent);
    }

    .option-text {
      font-size: 0.98rem;
    }

    .question-actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .feedback {
      margin-top: 14px;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid transparent;
      display: none;
    }

    .feedback.show { display: block; }

    .feedback.correct {
      background: var(--correct-bg);
      color: var(--correct);
      border-color: var(--correct-border);
    }

    .feedback.incorrect {
      background: var(--incorrect-bg);
      color: var(--incorrect);
      border-color: var(--incorrect-border);
    }

    .feedback.warning {
      background: var(--warning-bg);
      color: var(--warning);
      border-color: var(--warning-border);
    }

    .feedback strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.98rem;
    }

    .score-panel {
      display: none;
    }

    .score-panel.show {
      display: block;
    }

    .score-title {
      margin: 0 0 8px;
      font-size: 1.18rem;
    }

    .score-big {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .score-subtext {
      margin-top: 8px;
      color: var(--muted);
    }

    .legend {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .footer-note {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.94rem;
      padding: 0 4px;
    }

    .status-badge {
      font-size: 0.9rem;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: #fff;
    }

    @media (max-width: 720px) {
      .hero, .toolbar, .question-body, .question-head, .score-panel {
        padding-left: 16px;
        padding-right: 16px;
      }

      .question-head {
        gap: 12px;
      }
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(','\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']]
      },

      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>

<body>
  <div class="container">
    <section class="hero">
      <div class="course-title">FINC409/609 &mdash; Fixed Income Securities</div>
      <h1>Quiz Lecture 14: Interest Rate Options</h1>
    </section>

    <section class="toolbar" aria-label="Quiz controls">
      <div class="left">
        <button class="btn-primary" id="checkAllBtn" type="button">Check All &amp; Show Score</button>
        <button class="btn-secondary" id="resetBtn" type="button">Reset Quiz</button>
      </div>
      <div class="right">
        <span class="status-badge" id="progressBadge">0 of 10 answered</span>
      </div>
    </section>

    <section class="score-panel" id="scorePanel" aria-live="polite">
      <h2 class="score-title">Quiz Score</h2>
      <div class="score-big" id="scoreText">0 / 10</div>
      <div class="score-subtext" id="scoreSubtext">Select answers and check the quiz to see your score.</div>
      <div class="legend">Per-question feedback appears under each item after you check it.</div>
    </section>

    <main id="quiz" class="quiz-grid" aria-label="Quiz questions"></main>


  </div>

  <script>
    const questions = [
      {
        question: "Pricing an interest rate option on a binomial tree uses risk-neutral valuation. In this framework:",
        options: [
          "Future cash flows are discounted at investors' real-world expected return, using real-world probabilities \\(p\\) and \\(1-p\\).",
          "Future cash flows are discounted at the risk-free short rate from the tree, using risk-neutral probabilities \\(q\\) and \\(1-q\\) (which generally differ from real-world probabilities).",
          "Future cash flows are discounted at the risk-free rate, but using real-world probabilities \\(p\\) and \\(1-p\\).",
          "Future cash flows are not discounted at all, because risk-neutral investors are indifferent to the timing of payoffs."
        ],
        correctIndex: 1,
        explanation: "Risk-neutral valuation moves us to a hypothetical world in which all investors are risk-neutral, so the correct discount rate is the risk-free rate. The probabilities \\(q\\) attached to up/down moves are also adjusted relative to real-world \\(p\\). The lecture's Ho-Lee tree assumes \\(q = 0.5\\) at every node."
      },
      {
        question: "On the lecture's interest-rate tree (semi-annually compounded, \\(\\Delta = 0.5\\)), the value of a security at a non-terminal node \\(t\\) is computed as:",
        options: [
          "\\( V(t) = 0.5\\,V_{\\text{up}}(t+\\Delta) + 0.5\\,V_{\\text{down}}(t+\\Delta) \\) — the average of the two child values, with no discounting.",
          "\\( V(t) = \\dfrac{0.5\\,V_{\\text{up}}(t+\\Delta) + 0.5\\,V_{\\text{down}}(t+\\Delta)}{1 + r(t)/2} \\), using the **local** semi-annually compounded short rate \\(r(t)\\) at that node.",
          "\\( V(t) = \\dfrac{0.5\\,V_{\\text{up}}(t+\\Delta) + 0.5\\,V_{\\text{down}}(t+\\Delta)}{(1 + r(0)/2)^{2t}} \\), always discounting from each node back to today using the time-zero rate.",
          "\\( V(t) = \\dfrac{0.5\\,V_{\\text{up}}(t+\\Delta) + 0.5\\,V_{\\text{down}}(t+\\Delta)}{1 + r_{\\text{up}}(t+\\Delta)/2} \\), using the next-period up-state rate as the discount rate."
        ],
        correctIndex: 1,
        explanation: "Backward induction discounts **one period at a time** using the *local* short rate \\(r(t)\\) at the node being evaluated. The risk-neutral expectation of the two children is taken with \\(q = 0.5\\), then divided by \\(1 + r(t)/2\\) (since \\(\\Delta = 0.5\\) and the rate is semi-annually compounded). Stepping backward through the tree yields the time-zero value."
      },
      {
        question: "Consider a 0.5-year zero-coupon bond with face value \\(100\\). The current six-month spot rate is \\(r(0,0.5)\\) (continuously compounded), and the tree specifies that at \\(t=0.5\\) the rate moves to either \\(r_{\\text{up}}\\) or \\(r_{\\text{down}}\\). The bond's price today is:",
        options: [
          "\\( 100 \\times e^{-r(0,0.5)\\,\\times\\,0.5} \\); the future-node rates are not needed because the bond's only cash flow is at \\(t=0.5\\).",
          "\\( 100 \\times e^{-r(0,0.5)\\,\\times\\,0.5} \\), but only after verifying via the tree that the up- and down-state rates at \\(t=0.5\\) are consistent with the spot rate.",
          "\\( 0.5\\,\\times\\,100\\,e^{-r_{\\text{up}}\\,\\times\\,0.5} + 0.5\\,\\times\\,100\\,e^{-r_{\\text{down}}\\,\\times\\,0.5} \\); the future-node rates determine the present value.",
          "\\( 100 / (1 + r(0,0.5))^{0.5} \\); discrete annual compounding is the convention for Treasury zero-coupon bonds."
        ],
        correctIndex: 0,
        explanation: "A 0.5-year zero pays \\(100\\) at \\(t=0.5\\) regardless of the path. With the continuously compounded six-month spot rate \\(r(0,0.5)\\) the price is \\(100\\,e^{-r(0,0.5)\\,\\times\\,0.5}\\). What happens to the short rate **after** \\(t=0.5\\) is irrelevant for this bond because there are no cash flows beyond \\(t=0.5\\)."
      },
      {
        question: "A caplet on a six-month interest rate has expiration \\(T\\), strike \\(r_K\\), and notional \\(N\\). The lecture's payoff convention is:",
        options: [
          "\\( N \\times \\max[r_K - r(T-\\Delta),\\,0] \\), settled at \\(T-\\Delta\\) (set in arrears).",
          "\\( N \\times \\Delta \\times \\max[r(T-\\Delta) - r_K,\\,0] \\), settled at \\(T\\) — the rate is **set in advance** at \\(T-\\Delta\\) and **paid in arrears** at \\(T\\), with \\(\\Delta = 0.5\\).",
          "\\( N \\times \\Delta \\times \\max[r(T) - r_K,\\,0] \\), settled at \\(T\\), based on the spot rate observed at the payment date itself.",
          "\\( N \\times (r_K - r(T-\\Delta)) \\), settled continuously over the interval \\([T-\\Delta,\\,T]\\)."
        ],
        correctIndex: 1,
        explanation: "A caplet is a call option on interest rates with payoff \\(N\\,\\Delta\\,\\max[r(T-\\Delta) - r_K,\\,0]\\). The reference rate is observed at the start of the accrual period \\((T-\\Delta)\\) — set in advance — and the payoff is settled at the end of the period \\((T)\\) — paid in arrears. For a six-month rate, \\(\\Delta = 0.5\\)."
      },
      {
        question: "Compared to a caplet with the same strike \\(r_K\\), notional \\(N\\), tenor \\(\\Delta\\), and expiration, a floorlet:",
        options: [
          "Has the same payoff \\(N\\,\\Delta\\,\\max[r(T-\\Delta) - r_K,\\,0]\\); a floorlet is just a caplet from the writer's point of view.",
          "Has payoff \\(N\\,\\Delta\\,\\max[r_K - r(T-\\Delta),\\,0]\\); it is a **put** on interest rates and pays off when realized rates fall **below** the strike.",
          "Has payoff \\(N\\,\\Delta\\,(r_K - r(T-\\Delta))\\), which can be positive or negative; it is a forward, not an option.",
          "Pays whenever \\(r(T-\\Delta) \\neq r_K\\); the holder benefits from any deviation in either direction."
        ],
        correctIndex: 1,
        explanation: "A floorlet is a *put* on interest rates with payoff \\(N\\,\\Delta\\,\\max[r_K - r(T-\\Delta),\\,0]\\). It pays the holder when the realized rate is below the strike — the mirror image of the caplet's payoff."
      },
      {
        question: "The lecture decomposes the price of a callable bond as:",
        options: [
          "Callable bond price \\(=\\) non-callable bond price \\(+\\) value of a call option held by the **bondholder**.",
          "Callable bond price \\(=\\) non-callable bond price \\(-\\) value of a call option held by the **issuer**.",
          "Callable bond price \\(=\\) non-callable bond price \\(\\times\\) probability that the bond is never called.",
          "Callable bond price \\(=\\) non-callable bond price; the call option only matters at maturity, when the bond is worth par either way."
        ],
        correctIndex: 1,
        explanation: "The issuer holds the option to buy the bond back at the call price \\(K\\), so the bondholder is *short* that call. The callable bond's value therefore equals the non-callable bond's value **minus** the value of the issuer's call option."
      },
      {
        question: "On the binomial tree, at an in-tree call date the issuer's call value at a node satisfies:",
        options: [
          "\\(C(\\text{node}) = \\max(P-K,\\,0)\\) at every node — the issuer always exercises whenever the bond is above the call price.",
          "\\(C(\\text{node}) = 0\\) at every interior node — early exercise of an American-style call is never optimal.",
          "\\(C(\\text{node}) = \\max\\!\\Big(P - K,\\;\\dfrac{0.5\\,C_{\\text{up}} + 0.5\\,C_{\\text{down}}}{1 + r(\\text{node})/2}\\Big)\\) — the max of intrinsic value (exercise now) and continuation value (hold one more period).",
          "\\(C(\\text{node}) = P - K\\), regardless of sign — the issuer is contractually required to call at every call date."
        ],
        correctIndex: 2,
        explanation: "At each call date the issuer compares the value of exercising now (intrinsic value \\(\\max(P-K,\\,0)\\)) against the value of waiting one more period (the discounted risk-neutral expectation of the future call values). The call's value at that node is the **max** of the two; calling is optimal when intrinsic exceeds continuation value."
      },
      {
        question: "An interest-rate cap with maturity \\(T\\), strike \\(r_K\\), and notional \\(N\\), based on a \\(\\Delta\\)-period reference rate, is priced as:",
        options: [
          "A single option on the *average* realized rate over \\([0,\\,T]\\).",
          "The **sum** of the values of the individual caplets — one caplet per reset date in \\((0,\\,T]\\).",
          "The **maximum** across reset dates of \\(N\\,\\Delta\\,\\max[r(t-\\Delta) - r_K,\\,0]\\).",
          "\\(N\\,\\Delta\\,\\max[\\bar r - r_K,\\,0]\\), where \\(\\bar r\\) is the time-zero forward rate to maturity."
        ],
        correctIndex: 1,
        explanation: "A cap is just a portfolio of caplets — one caplet per accrual period (reset date). Each caplet is priced independently on the tree and the cap's value is the sum. The same logic gives a floor as the sum of floorlets. In the lecture's example, the 1.5-year cap at 1.75% is worth \\(0 + 0.495 + 0.9745 = 1.47\\)."
      },
      {
        question: "On the lecture's tree, a plain (uncapped) floating-rate bond has time-zero price \\(100\\), but the otherwise identical capped floater (cap of 1.75% on the annual coupon) is priced below par at \\(98.53\\). The reason is:",
        options: [
          "Capped floaters are riskier than plain floaters and so require a higher yield, which depresses their price.",
          "In states where the cap binds, the bondholder receives a coupon **below** the prevailing market rate; the foregone upside is exactly the value of a long cap, so capped floater \\(=\\) floater \\(-\\) cap.",
          "The cap is effectively a *floor* from the bondholder's perspective, and embedded floors trade below par.",
          "Capped floaters must be priced off a separate, higher-discount-rate tree, which mechanically lowers their price."
        ],
        correctIndex: 1,
        explanation: "When rates rise above the cap rate (1.75% annual = 0.875 per semi-annual period in this example), the cap binds and the bondholder gives up the rate excess. That foregone upside is precisely what a long cap would have paid. Hence capped floater \\(+\\) cap \\(=\\) plain floater (\\(98.53 + 1.47 = 100\\)), so the capped floater trades below par by the value of the cap."
      },
      {
        question: "The lecture's parity relation links a plain floater, a cap at strike \\(r_K\\), a floor at the same strike \\(r_K\\), and a fixed-coupon bond with coupon rate \\(r_K\\). It states:",
        options: [
          "Floater \\(+\\) Cap \\(+\\) Floor \\(=\\) Fixed-coupon bond at \\(r_K\\).",
          "Floater \\(-\\) Cap \\(+\\) Floor \\(=\\) Fixed-coupon bond at \\(r_K\\).",
          "Floater \\(+\\) Cap \\(-\\) Floor \\(=\\) Fixed-coupon bond at \\(r_K\\).",
          "Floater \\(\\times\\) Cap \\(\\times\\) Floor \\(=\\) Fixed-coupon bond at \\(r_K\\)."
        ],
        correctIndex: 1,
        explanation: "Long floater \\(+\\) short cap \\(+\\) long floor (all at strike \\(r_K\\)) replicates a bond paying exactly \\(r_K\\) every period: when realized rates exceed \\(r_K\\), the short cap caps the coupon at \\(r_K\\); when rates fall below \\(r_K\\), the long floor lifts it back to \\(r_K\\). By the Law of One Price, Floater \\(-\\) Cap \\(+\\) Floor \\(=\\) Fixed-coupon bond. In the lecture's example: \\(100 - 1.47 + 0.18 = 98.71\\)."
      }
    ];

    const quizEl = document.getElementById("quiz");
    const progressBadge = document.getElementById("progressBadge");
    const scorePanel = document.getElementById("scorePanel");
    const scoreText = document.getElementById("scoreText");
    const scoreSubtext = document.getElementById("scoreSubtext");
    const checkAllBtn = document.getElementById("checkAllBtn");
    const resetBtn = document.getElementById("resetBtn");

    function typesetMath(target) {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise(target ? [target] : undefined).catch(() => {});
      }
    }

    function renderQuiz() {
      quizEl.innerHTML = "";
      questions.forEach((q, index) => {
        const card = document.createElement("section");
        card.className = "question-card";
        card.dataset.index = index;

        const optionsHTML = q.options.map((option, optionIndex) => `
          <label class="option">
            <input type="radio" name="q${index}" value="${optionIndex}" />
            <span class="option-text"><strong>${String.fromCharCode(65 + optionIndex)}.</strong> ${option}</span>
          </label>
        `).join("");

        card.innerHTML = `
          <div class="question-head">
            <div class="question-number">${index + 1}</div>
            <h2 class="question-title">${q.question}</h2>
          </div>
          <div class="question-body">
            <div class="options" role="radiogroup" aria-label="Question ${index + 1}">
              ${optionsHTML}
            </div>
            <div class="question-actions">
              <button class="btn-small btn-primary" type="button" data-action="check" data-index="${index}">
                Check Answer
              </button>
            </div>
            <div class="feedback" id="feedback-${index}" aria-live="polite"></div>
          </div>
        `;
        quizEl.appendChild(card);
      });
      updateProgress();
      typesetMath(quizEl);
    }

    function getSelectedIndex(questionIndex) {
      const selected = document.querySelector(`input[name="q${questionIndex}"]:checked`);
      return selected ? Number(selected.value) : null;
    }

    function showFeedback(questionIndex, mode = "single") {
      const q = questions[questionIndex];
      const selectedIndex = getSelectedIndex(questionIndex);
      const feedbackEl = document.getElementById(`feedback-${questionIndex}`);
      feedbackEl.className = "feedback show";

      if (selectedIndex === null) {
        feedbackEl.classList.add("warning");
        feedbackEl.innerHTML = `
          <strong>No answer selected yet.</strong>
          Choose one option, then check your answer.
        `;
        typesetMath(feedbackEl);
        return { answered: false, correct: false };
      }

      if (selectedIndex === q.correctIndex) {
        feedbackEl.classList.add("correct");
        feedbackEl.innerHTML = `
          <strong>Correct.</strong>
          ${q.explanation}
        `;
        typesetMath(feedbackEl);
        return { answered: true, correct: true };
      } else {
        feedbackEl.classList.add("incorrect");
        const correctLetter = String.fromCharCode(65 + q.correctIndex);
        feedbackEl.innerHTML = `
          <strong>Incorrect.</strong>
          Correct answer: <strong>${correctLetter}</strong>. ${q.explanation}
        `;
        typesetMath(feedbackEl);
        return { answered: true, correct: false };
      }
    }

    function updateProgress() {
      let answered = 0;
      questions.forEach((_, index) => {
        if (getSelectedIndex(index) !== null) answered += 1;
      });
      progressBadge.textContent = `${answered} of ${questions.length} answered`;
    }

    function scoreQuiz() {
      let answered = 0;
      let correct = 0;

      questions.forEach((_, index) => {
        const result = showFeedback(index, "all");
        if (result.answered) answered += 1;
        if (result.correct) correct += 1;
      });

      const percent = Math.round((correct / questions.length) * 100);
      scorePanel.classList.add("show");
      scoreText.textContent = `${correct} / ${questions.length}`;

      if (answered < questions.length) {
        scoreSubtext.textContent = `You have ${correct} correct so far (${percent}%). ${questions.length - answered} question(s) are still unanswered.`;
      } else {
        scoreSubtext.textContent = `You answered all questions. Score: ${percent}%.`;
      }
    }

    function resetQuiz() {
      document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.checked = false;
      });
      document.querySelectorAll('.feedback').forEach(el => {
        el.className = 'feedback';
        el.innerHTML = '';
      });
      scorePanel.classList.remove("show");
      scoreText.textContent = "0 / 10";
      scoreSubtext.textContent = "Select answers and check the quiz to see your score.";
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("change", (event) => {
      if (event.target.matches('input[type="radio"]')) {
        updateProgress();
      }
    });

    document.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action='check']");
      if (!btn) return;
      const index = Number(btn.dataset.index);
      showFeedback(index, "single");
      updateProgress();
    });

    checkAllBtn.addEventListener("click", scoreQuiz);
    resetBtn.addEventListener("click", resetQuiz);

    renderQuiz();
  </script>
</body>
</html>
