<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FINC409/609 - Fixed Income Securities</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#d7dee8;
      --accent:#1d4ed8;
      --accent-soft:#e8f0ff;
      --correct:#166534;
      --correct-bg:#ecfdf3;
      --correct-border:#bbf7d0;
      --incorrect:#991b1b;
      --incorrect-bg:#fef2f2;
      --incorrect-border:#fecaca;
      --warning:#92400e;
      --warning-bg:#fff7ed;
      --warning-border:#fed7aa;
      --shadow:0 10px 30px rgba(17, 24, 39, 0.08);
      --radius:18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(29,78,216,0.08), transparent 24%),
        radial-gradient(circle at top left, rgba(37,99,235,0.06), transparent 18%),
        var(--bg);
      line-height: 1.5;
    }

    .container {
      width: min(1080px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    .hero {
      background: linear-gradient(135deg, #123a9b, #1d4ed8 55%, #3b82f6);
      color: white;
      border-radius: 24px;
      padding: 28px 28px 24px;
      box-shadow: var(--shadow);
    }

    .hero .course-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      margin-bottom: 10px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(1.9rem, 3.5vw, 2.7rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 1rem;
      max-width: 820px;
      color: rgba(255,255,255,0.92);
    }

    .hero .meta {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.92rem;
      backdrop-filter: blur(8px);
    }

    .toolbar,
    .score-panel {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar .left,
    .toolbar .right {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(29, 78, 216, 0.18);
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 0.92rem;
    }

    .quiz-grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .question-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px 10px;
      border-bottom: 1px solid rgba(215, 222, 232, 0.7);
      background: linear-gradient(180deg, rgba(29,78,216,0.035), transparent);
    }

    .question-number {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      border: 1px solid rgba(29,78,216,0.12);
    }

    .question-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .question-body {
      padding: 16px 20px 20px;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    label.option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    }

    label.option:hover {
      border-color: rgba(29,78,216,0.4);
      background: rgba(29,78,216,0.03);
      transform: translateY(-1px);
    }

    label.option input {
      margin-top: 2px;
      transform: scale(1.1);
      accent-color: var(--accent);
    }

    .option-text {
      font-size: 0.98rem;
    }

    .question-actions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .feedback {
      margin-top: 14px;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid transparent;
      display: none;
    }

    .feedback.show { display: block; }

    .feedback.correct {
      background: var(--correct-bg);
      color: var(--correct);
      border-color: var(--correct-border);
    }

    .feedback.incorrect {
      background: var(--incorrect-bg);
      color: var(--incorrect);
      border-color: var(--incorrect-border);
    }

    .feedback.warning {
      background: var(--warning-bg);
      color: var(--warning);
      border-color: var(--warning-border);
    }

    .feedback strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.98rem;
    }

    .score-panel {
      display: none;
    }

    .score-panel.show {
      display: block;
    }

    .score-title {
      margin: 0 0 8px;
      font-size: 1.18rem;
    }

    .score-big {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .score-subtext {
      margin-top: 8px;
      color: var(--muted);
    }

    .legend {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .footer-note {
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.94rem;
      padding: 0 4px;
    }

    .status-badge {
      font-size: 0.9rem;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: #fff;
    }

    @media (max-width: 720px) {
      .hero, .toolbar, .question-body, .question-head, .score-panel {
        padding-left: 16px;
        padding-right: 16px;
      }

      .question-head {
        gap: 12px;
      }
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(','\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']]
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="container">
    <section class="hero">
      <div class="course-title">FINC409/609 &mdash; Fixed Income Securities</div>
      <h1>Quiz Lecture 12: Forwards</h1>
    </section>

    <section class="toolbar" aria-label="Quiz controls">
      <div class="left">
        <button class="btn-primary" id="checkAllBtn" type="button">Check All &amp; Show Score</button>
        <button class="btn-secondary" id="resetBtn" type="button">Reset Quiz</button>
      </div>
      <div class="right">
        <span class="status-badge" id="progressBadge">0 of 10 answered</span>
      </div>
    </section>

    <section class="score-panel" id="scorePanel" aria-live="polite">
      <h2 class="score-title">Quiz Score</h2>
      <div class="score-big" id="scoreText">0 / 10</div>
      <div class="score-subtext" id="scoreSubtext">Select answers and check the quiz to see your score.</div>
      <div class="legend">Per-question feedback appears under each item after you check it.</div>
    </section>

    <main id="quiz" class="quiz-grid" aria-label="Quiz questions"></main>


  </div>

  <script>
    const questions = [
      {
        question: "What does the forward rate \\(f(T_1, T_2)\\) represent?",
        options: [
          "An interest rate agreed upon today for borrowing or lending over the future period from \\(T_1\\) to \\(T_2\\).",
          "The spot rate that will actually prevail at time \\(T_1\\) for a loan ending at \\(T_2\\).",
          "An investor's personal forecast of the rate at \\(T_1\\), with no contractual commitment.",
          "The discount factor today for a cash flow received at time \\(T_2\\)."
        ],
        correctIndex: 0,
        explanation: "A forward rate is locked in today via no-arbitrage from current bond prices. It is a contractual rate for the future period \\([T_1,T_2]\\), not a forecast and not a discount factor."
      },
      {
        question: "Which statement best distinguishes a spot rate from a forward rate?",
        options: [
          "A spot rate is always quoted annually, while a forward rate is always semi-annual.",
          "A spot rate is the rate today for a loan starting today, while a forward rate is the rate set today for a loan starting at a future date.",
          "A spot rate is risk-free, while a forward rate carries credit risk.",
          "A spot rate uses discount factors, but a forward rate does not."
        ],
        correctIndex: 1,
        explanation: "Both rates are determined today, but they apply to different start dates: spot starts now, forward starts later. Both are ultimately built from the same set of discount factors."
      },
      {
        question: "In a standard Forward Rate Agreement (FRA) on notional \\(N\\) over \\([T_1, T_2]\\), what do the two parties exchange?",
        options: [
          "The principal \\(N\\) at \\(T_1\\) and again at \\(T_2\\).",
          "Coupon payments versus the bond's face value at \\(T_2\\).",
          "Net interest based on the difference between the agreed forward rate \\(f(T_1,T_2)\\) and the realized spot rate \\(r(T_1,T_2)\\), applied to \\(N\\) over the period \\(\\Delta = T_2 - T_1\\). The notional is not exchanged.",
          "The prices of two different zero-coupon bonds at \\(T_1\\)."
        ],
        correctIndex: 2,
        explanation: "An FRA settles the net interest differential on the notional. The notional itself is never exchanged — it only scales the cash flow."
      },
      {
        question: "A counterparty that pays the fixed forward rate and receives the realized floating spot rate in an FRA gains when:",
        options: [
          "the realized spot rate at \\(T_1\\) is above the contracted forward rate.",
          "the realized spot rate at \\(T_1\\) is below the contracted forward rate.",
          "the yield curve inverts between inception and \\(T_1\\), regardless of the level.",
          "the discount factor \\(D(T_1)\\) rises between inception and \\(T_1\\)."
        ],
        correctIndex: 0,
        explanation: "The floating-rate receiver / fixed-rate payer profits when the realized rate exceeds the locked-in forward rate, because the inflow exceeds the outflow on the notional."
      },
      {
        question: "How can the payoff of a forward loan from \\(T_1\\) to \\(T_2\\) be synthetically replicated today using zero-coupon bonds?",
        options: [
          "Buy both a \\(T_1\\) zero and a \\(T_2\\) zero with equal face values.",
          "Short both a \\(T_1\\) zero and a \\(T_2\\) zero.",
          "Take an offsetting long-and-short position in a \\(T_1\\) zero and a \\(T_2\\) zero. The implied forward rate is pinned down by the ratio \\(D(T_1)/D(T_2)\\).",
          "Buy only coupon bonds — the strategy cannot be done with zeros."
        ],
        correctIndex: 2,
        explanation: "Combining a long position in one zero and a short position in another constructs a known cash flow at \\(T_1\\) and an offsetting cash flow at \\(T_2\\). No-arbitrage forces the implied rate over \\([T_1,T_2]\\) to be determined by \\(D(T_1)/D(T_2)\\)."
      },
      {
        question: "A forward contract on a bond is best described as:",
        options: [
          "an agreement to swap floating coupons for fixed coupons on the bond.",
          "an agreement to buy or sell a specified bond at a price agreed today, with delivery and payment on a future settlement date.",
          "a credit-default-style payoff that compensates the buyer if the bond defaults.",
          "a promise to deliver a cash amount equal to the bond's yield to maturity."
        ],
        correctIndex: 1,
        explanation: "A bond forward locks in a future purchase or sale price today. The price is set so that the contract has zero value at inception under no-arbitrage."
      },
      {
        question: "An FRA has zero value at inception. After some time has passed, its value is generally non-zero because:",
        options: [
          "the notional has now been exchanged between the counterparties.",
          "the bond's coupon has accrued and been paid out.",
          "the term structure has moved, so the new fair forward rate for the remaining period differs from the rate originally locked in.",
          "the discount factor at \\(T_1\\) ceases to exist once time passes."
        ],
        correctIndex: 2,
        explanation: "Repricing an existing FRA means recomputing the fair forward rate for the remaining period with current discount factors. Any gap between the old contracted rate and the new fair rate produces a non-zero value."
      },
      {
        question: "Under the Expectations Hypothesis, today's forward rate \\(f(T_1, T_2)\\) equals:",
        options: [
          "today's spot rate \\(r(0, T_2)\\).",
          "the realized future spot rate \\(r(T_1, T_2)\\), known with certainty.",
          "zero plus a constant term premium fixed by regulation.",
          "the market's expectation today of the future spot rate \\(r(T_1, T_2)\\)."
        ],
        correctIndex: 3,
        explanation: "The Expectations Hypothesis equates today's forward rate to the expected future spot rate. It assumes no risk or term premium, which is why it is a hypothesis rather than an empirical truth."
      },
      {
        question: "Under the (pure) Expectations Hypothesis, an upward-sloping spot-rate curve implies that the market expects future short rates to:",
        options: [
          "fall over time.",
          "remain constant.",
          "rise over time.",
          "become more volatile, but with an unchanged mean."
        ],
        correctIndex: 2,
        explanation: "If long rates exceed short rates and there is no term premium, the only way the no-arbitrage averaging holds is if expected future short rates are higher than the current short rate."
      },
      {
        question: "A common explanation for why an inverted yield curve has often preceded recessions is:",
        options: [
          "long-term bonds default more frequently in recessions, pushing their yields down.",
          "the Fed mechanically inverts the yield curve before every recession by policy rule.",
          "convexity flips sign during recessions, making long bonds cheaper than short bonds.",
          "investors expect future short rates to fall — for example, because the Fed is expected to ease in a downturn — which drags long yields below current short yields."
        ],
        correctIndex: 3,
        explanation: "Through the lens of the Expectations Hypothesis, an inversion signals expected rate cuts ahead. Markets price in anticipated easing during a slowdown, pulling long-term yields below short-term yields."
      }
    ];

    const quizEl = document.getElementById("quiz");
    const progressBadge = document.getElementById("progressBadge");
    const scorePanel = document.getElementById("scorePanel");
    const scoreText = document.getElementById("scoreText");
    const scoreSubtext = document.getElementById("scoreSubtext");
    const checkAllBtn = document.getElementById("checkAllBtn");
    const resetBtn = document.getElementById("resetBtn");

    function typesetMath(target) {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise(target ? [target] : undefined).catch(() => {});
      }
    }

    function renderQuiz() {
      quizEl.innerHTML = "";
      questions.forEach((q, index) => {
        const card = document.createElement("section");
        card.className = "question-card";
        card.dataset.index = index;

        const optionsHTML = q.options.map((option, optionIndex) => `
          <label class="option">
            <input type="radio" name="q${index}" value="${optionIndex}" />
            <span class="option-text"><strong>${String.fromCharCode(65 + optionIndex)}.</strong> ${option}</span>
          </label>
        `).join("");

        card.innerHTML = `
          <div class="question-head">
            <div class="question-number">${index + 1}</div>
            <h2 class="question-title">${q.question}</h2>
          </div>
          <div class="question-body">
            <div class="options" role="radiogroup" aria-label="Question ${index + 1}">
              ${optionsHTML}
            </div>
            <div class="question-actions">
              <button class="btn-small btn-primary" type="button" data-action="check" data-index="${index}">
                Check Answer
              </button>
            </div>
            <div class="feedback" id="feedback-${index}" aria-live="polite"></div>
          </div>
        `;
        quizEl.appendChild(card);
      });
      updateProgress();
      typesetMath(quizEl);
    }

    function getSelectedIndex(questionIndex) {
      const selected = document.querySelector(`input[name="q${questionIndex}"]:checked`);
      return selected ? Number(selected.value) : null;
    }

    function showFeedback(questionIndex, mode = "single") {
      const q = questions[questionIndex];
      const selectedIndex = getSelectedIndex(questionIndex);
      const feedbackEl = document.getElementById(`feedback-${questionIndex}`);
      feedbackEl.className = "feedback show";

      if (selectedIndex === null) {
        feedbackEl.classList.add("warning");
        feedbackEl.innerHTML = `
          <strong>No answer selected yet.</strong>
          Choose one option, then check your answer.
        `;
        typesetMath(feedbackEl);
        return { answered: false, correct: false };
      }

      if (selectedIndex === q.correctIndex) {
        feedbackEl.classList.add("correct");
        feedbackEl.innerHTML = `
          <strong>Correct.</strong>
          ${q.explanation}
        `;
        typesetMath(feedbackEl);
        return { answered: true, correct: true };
      } else {
        feedbackEl.classList.add("incorrect");
        const correctLetter = String.fromCharCode(65 + q.correctIndex);
        feedbackEl.innerHTML = `
          <strong>Incorrect.</strong>
          Correct answer: <strong>${correctLetter}</strong>. ${q.explanation}
        `;
        typesetMath(feedbackEl);
        return { answered: true, correct: false };
      }
    }

    function updateProgress() {
      let answered = 0;
      questions.forEach((_, index) => {
        if (getSelectedIndex(index) !== null) answered += 1;
      });
      progressBadge.textContent = `${answered} of ${questions.length} answered`;
    }

    function scoreQuiz() {
      let answered = 0;
      let correct = 0;

      questions.forEach((_, index) => {
        const result = showFeedback(index, "all");
        if (result.answered) answered += 1;
        if (result.correct) correct += 1;
      });

      const percent = Math.round((correct / questions.length) * 100);
      scorePanel.classList.add("show");
      scoreText.textContent = `${correct} / ${questions.length}`;

      if (answered < questions.length) {
        scoreSubtext.textContent = `You have ${correct} correct so far (${percent}%). ${questions.length - answered} question(s) are still unanswered.`;
      } else {
        scoreSubtext.textContent = `You answered all questions. Score: ${percent}%.`;
      }
    }

    function resetQuiz() {
      document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.checked = false;
      });
      document.querySelectorAll('.feedback').forEach(el => {
        el.className = 'feedback';
        el.innerHTML = '';
      });
      scorePanel.classList.remove("show");
      scoreText.textContent = "0 / 10";
      scoreSubtext.textContent = "Select answers and check the quiz to see your score.";
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.addEventListener("change", (event) => {
      if (event.target.matches('input[type="radio"]')) {
        updateProgress();
      }
    });

    document.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action='check']");
      if (!btn) return;
      const index = Number(btn.dataset.index);
      showFeedback(index, "single");
      updateProgress();
    });

    checkAllBtn.addEventListener("click", scoreQuiz);
    resetBtn.addEventListener("click", resetQuiz);

    renderQuiz();
  </script>
</body>
</html>
